!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para pedidos</title>

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/contato.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="div-logo">
            <img class="logotipo" src="../img/logo.png" alt="Logotipo da Confeitaria">
        </div>

        <div class="div-menu">
            <h1>
                Confeitaria Sempre Doce
            </h1>

            <br />

            <nav>
                <ul>
                    <li>
                        <a href="../index.html">Início</a>
                    </li>
                    <li>
                        <a href="pages/sobre.html">Sobre</a>
                    </li>
                    <li>
                        <a href="cardapio.html">Cardápio</a>
                    </li>
                    <li>
                        <a href="pages/contato.html">Contato</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <body>
    <h1>Formulário de Pedidos</h1>

     <form>
        <div class="container">

            <fieldset>
                <legend>♡ Dados Pessoais do Cliente</legend>

                <div>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome"
                        placeholder="Digite seu nome" required>
                </div>

                
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email"
                        placeholder="seuemail@email.com" required>
                </div>

                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone"
                        placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo-checkbox">
                    <label for="whatsapp">Possui WhatsApp?</label>
                    <input type="checkbox" id="whatsapp" name="whatsapp"
                        class="checkbox">
                </div>

            </fieldset>

            <fieldset>
                <legend>♡ Endereço</legend>

                <div>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep"
                        placeholder="00000-000">
                </div>

                <div>
                    <label for="logradouro">Rua:</label>
                    <input type="text" id="logradouro" name="logradouro"
                        placeholder="Nome da rua">
                </div>

                <div>
                    <label for="numero">Número:</label>
                    <input type="number" id="numero" name="numero"
                        placeholder="Nº da residência">
                </div>

                <div>
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro"
                        placeholder="Seu bairro">
                </div>

                <div>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade"
                        placeholder="Sua cidade">
                </div>

                <div>
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado"
                        placeholder="Seu estado">
                </div>

            </fieldset>

        </div>

        <div class="container">

            <fieldset>
                <legend>♡ Informaçoes do Pedido</legend>

                <div>
                    <label for="item">Item (Bolo):</label>
                    <select id="item" name="item" required>
                        <option value="">-- SELECIONE O BOLO --</option>
                        <option value="chocolate">Bolo de Chocolate - R$ 70,00</option>
                        <option value="morango">Bolo de Morango - R$ 80,00</option>
                        <option value="cenoura">Bolo de Cenoura - R$ 70,00</option>
                        <option value="limao">Bolo de Limão - R$ 83,00</option>
                        <option value="ninho-nutella">Bolo de Ninho com Nutella- R$ 90,00</option>
                    </select>
                </div>


                <div>
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" name="quantidade"
                        min="1" value="1" placeholder="Quantidade desejada" required>
                </div>

                <div>
                    <label for="total">Total:</label>
                    <input type="text" id="total" name="total" value="R$ 0,00" readonly>
                </div>

                <div>
                    <label for="pagamento">Forma de Pagamento:</label>
                    <select id="pagamento" name="pagamento" required>
                        <option value="">-- SELECIONE --</option>
                        <option value="pix">Pix</option>
                        <option value="cartao">Cartão</option>
                    </select>
                </div>

                <div>
                    <label for="data">Data desejada:</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div>
                    <label for="entrega">Entrega:</label>
                    <select id="entrega" name="entrega" required>
                        <option value="">-- SELECIONE --</option>
                        <option value="Retirar na confeitaria">Retirar na confeitaria</option>
                        <option value="Receber em casa">Receber em casa</option>
                    </select>
                </div>

            </fieldset>

            

        </div>

        <div class="container botoes">
            <button type="submit">♡ Cadastrar encomenda</button>
            <button type="reset">Limpar formulário</button>
        </div>

        <p id="mensagem" class="mensagem" aria-live="polite"></p>

    </form>

    <footer class="rodape">
        <p>Confeitaria Sempre Doce ♡</p>
        <span>Feito com carinho para adoçar seus momentos!</span>
    </footer>

    <script>
        // Tabela de preços dos bolos
        const precosBolos = {
            "ninho-nutella": 90.00,
            "cenoura": 70.00,
            "chocolate": 70.00,
            "limao": 83.00,
            "morango": 80.00
        };

        const itemSelect = document.getElementById("item");
        const precoUnitarioInput = document.getElementById("preco-unitario");
        const quantidadeInput = document.getElementById("quantidade");
        const totalInput = document.getElementById("total");
        const formulario = document.getElementById("formulario");
        const mensagem = document.getElementById("mensagem");

        function calcularTotal() {
            const boloSelecionado = itemSelect.value;
            const quantidade = parseInt(quantidadeInput.value) || 0;

            if (boloSelecionado && precosBolos[boloSelecionado] !== undefined) {
                const precoUnitario = precosBolos[boloSelecionado];
                precoUnitarioInput.value = `R$ ${precoUnitario.toFixed(2).replace('.', ',')}`;
               
                const total = precoUnitario * quantidade;
                totalInput.value = `R$ ${total.toFixed(2).replace('.', ',')}`;
            } else {
                precoUnitarioInput.value = "R$ 0,00";
                totalInput.value = "R$ 0,00";
            }
        }

        itemSelect.addEventListener("change", calcularTotal);
        quantidadeInput.addEventListener("input", calcularTotal);

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            mensagem.textContent =
                "Obrigada! Sua encomenda foi cadastrada com sucesso. ♡";

            formulario.reset();
            precoUnitarioInput.value = "R$ 0,00";
            totalInput.value = "R$ 0,00";
        });

        formulario.addEventListener("reset", function() {
            mensagem.textContent = "";
            precoUnitarioInput.value = "R$ 0,00";
            totalInput.value = "R$ 0,00";
        });
    </script>

</body>

</html>
